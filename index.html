<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eSSL Attendance</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f4f6f8;color:#172033}.app{display:flex;min-height:100vh}.side{width:240px;background:#111b2e;color:#dce4f0;padding:22px 14px}.brand{font-size:20px;font-weight:700;padding:8px 10px 25px}.nav button{width:100%;padding:11px 12px;margin:3px 0;border:0;border-radius:8px;background:transparent;color:#b8c3d4;text-align:left;font-size:14px;cursor:pointer}.nav button.active,.nav button:hover{background:#263550;color:#fff}.main{flex:1;padding:28px;max-width:1600px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.head h1{margin:0;font-size:26px}.sub{color:#7b8799;font-size:13px;margin-top:4px}.online{background:#e8f7ee;color:#187342;border-radius:20px;padding:7px 12px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:18px}.card{background:#fff;border:1px solid #e4e8ee;border-radius:12px;padding:18px}.label{color:#7a8799;font-size:12px}.value{font-size:28px;font-weight:700;margin-top:9px}.panel{background:#fff;border:1px solid #e4e8ee;border-radius:12px;padding:20px;margin-bottom:18px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.panel h2{font-size:17px;margin:0}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid #edf0f3}th{color:#788497;background:#fafbfc}.pill{padding:4px 8px;border-radius:12px;background:#eef4ff;color:#315e9b}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}input,select{border:1px solid #d9dee6;border-radius:7px;padding:9px 10px;background:#fff}button.primary{border:0;background:#17233a;color:#fff;border-radius:7px;padding:9px 14px;cursor:pointer}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.hidden{display:none}.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;padding:12px 15px;border-radius:8px;box-shadow:0 5px 25px #0002}@media(max-width:900px){.side{width:190px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:650px){.side{display:none}.main{padding:16px}.cards{grid-template-columns:1fr 1fr}}</style></head><body><div class="app"><aside class="side"><div class="brand">eSSL Attendance</div><div class="nav" id="nav"></div><div style="font-size:11px;color:#718096;padding:30px 10px">Cloud-first<br>eSSL integration ready</div></aside><main class="main"><div class="head"><div><h1 id="title">Dashboard</h1><div class="sub">Worker attendance & workforce management</div></div><div class="online">● Application Online</div></div><div id="content"></div></main></div><div id="toast" class="toast hidden"></div><script>const menus=['Dashboard','Live Attendance','Employees','Contractors','Shifts','Reports','Devices'];let current='Dashboard';const sample=[{code:'REG-001',name:'Ramesh Kumar',type:'Regular',contractor:'—',dept:'Production',time:'08:02',status:'IN',device:'MARS-001'},{code:'CNT-024',name:'Suresh',type:'Contract',contractor:'ABC Services',dept:'Maintenance',time:'08:07',status:'IN',device:'MARS-001'},{code:'CNT-031',name:'Mahesh',type:'Contract',contractor:'XYZ Engineering',dept:'Fabrication',time:'08:13',status:'IN',device:'MARS-002'}];function renderNav(){nav.innerHTML=menus.map(m=>`<button class="${m===current?'active':''}" onclick="go('${m}')">${m}</button>`).join('')}function go(m){current=m;title.textContent=m;renderNav();render()}function render(){if(current==='Dashboard')dashboard();else if(current==='Live Attendance')live();else if(current==='Employees'||current==='Contractors')employees();else if(current==='Shifts')shifts();else if(current==='Reports')reports();else devices()}function table(rows){return `<table><tr><th>Worker</th><th>Type</th><th>Time</th><th>Device</th><th>Status</th></tr>${rows.map(x=>`<tr><td><b>${x.code}</b><br>${x.name}</td><td>${x.type}</td><td>${x.time}</td><td>${x.device}</td><td><span class="pill">${x.status}</span></td></tr>`).join('')}</table>`}function dashboard(){content.innerHTML=`<div class="cards"><div class="card"><div class="label">Active Workers</div><div class="value">0</div></div><div class="card"><div class="label">Present Today</div><div class="value">0</div></div><div class="card"><div class="label">Regular Workers</div><div class="value">0</div></div><div class="card"><div class="label">Contract Workers</div><div class="value">0</div></div></div><div class="grid2"><div class="panel"><div class="panelhead"><h2>Live Attendance</h2><span class="sub">Auto refresh</span></div>${table(sample)}</div><div class="panel"><div class="panelhead"><h2>Device Status</h2></div><table><tr><th>Device</th><th>Location</th><th>Status</th></tr><tr><td>MARS-001</td><td>Main Gate</td><td><span class="pill">Online</span></td></tr><tr><td>MARS-002</td><td>Workshop</td><td><span class="pill">Online</span></td></tr></table></div></div>`}function live(){content.innerHTML=`<div class="panel"><div class="toolbar"><input placeholder="Search employee / contractor"><select><option>All devices</option><option>MARS-001</option><option>MARS-002</option></select><button class="primary" onclick="toast('Sync request queued')">Sync eSSL</button></div>${table(sample)}</div>`}function employees(){let c=current==='Contractors';content.innerHTML=`<div class="panel"><div class="panelhead"><h2>${c?'Contractor':'Employee'} Master</h2><button class="primary" onclick="toast('Master form will connect to PostgreSQL')">+ Add ${c?'Contractor':'Worker'}</button></div><div class="toolbar"><input placeholder="Search..."><select><option>Active</option><option>Inactive</option></select></div><table><tr><th>Code</th><th>Name</th><th>Type</th><th>Contractor</th><th>Department</th><th>Status</th></tr><tr><td>REG-001</td><td>Ramesh Kumar</td><td>Regular</td><td>—</td><td>Production</td><td>Active</td></tr><tr><td>CNT-024</td><td>Suresh</td><td>Contract</td><td>ABC Services</td><td>Maintenance</td><td>Active</td></tr></table></div>`}function shifts(){content.innerHTML=`<div class="panel"><div class="panelhead"><h2>Shift Master</h2><button class="primary">+ Add Shift</button></div><table><tr><th>Shift</th><th>Start</th><th>End</th><th>Grace</th><th>OT After</th></tr><tr><td>General</td><td>08:00</td><td>17:00</td><td>10 min</td><td>17:30</td></tr><tr><td>Shift A</td><td>06:00</td><td>14:00</td><td>10 min</td><td>14:30</td></tr></table></div>`}function reports(){content.innerHTML=`<div class="panel"><h2>Attendance Reports</h2><div class="toolbar" style="margin-top:15px"><input type="date"><input type="date"><select><option>All Workers</option><option>Regular</option><option>Contract</option></select><button class="primary" onclick="toast('Report generation will use cloud attendance data')">Generate Report</button></div><p class="sub">Daily muster, monthly attendance, late/early and overtime reports will be available here.</p></div>`}function devices(){content.innerHTML=`<div class="panel"><div class="panelhead"><h2>eSSL Devices</h2><button class="primary" onclick="toast('Device registration will use eSSL API')">+ Add Device</button></div><table><tr><th>Serial Number</th><th>Name</th><th>Location</th><th>Communication</th><th>Status</th><th>Last Sync</th></tr><tr><td>MARS-001</td><td>AiFace Mars 1</td><td>Main Gate</td><td>Wi-Fi</td><td><span class="pill">Online</span></td><td>Waiting for API</td></tr><tr><td>MARS-002</td><td>AiFace Mars 2</td><td>Workshop</td><td>Wi-Fi</td><td><span class="pill">Online</span></td><td>Waiting for API</td></tr></table></div>`}function toast(s){let x=document.getElementById('toast');x.textContent=s;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2500)}renderNav();render();</script></body></html>
